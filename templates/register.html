
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080D1B">

    <link rel="icon" type="image/svg+xml"
          href="{{ asset_url('favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
    <link rel="stylesheet" href="{{ asset_url('css/auth.css') }}">

    <title>Create an Account | Tsukuyomi</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="register-title">
            <h1 class="auth-title" id="register-title">
                Create Account
            </h1>

            <p class="auth-description">
                A quiet place for your thoughts, letters, and memories
                beneath the same moon.
            </p>

            {% if error_message %}
                <p class="auth-message" role="alert">
                    {{ error_message }}
                </p>
            {% endif %}

            {% if success_message %}
                <p class="auth-message" role="status">
                    {{ success_message }}
                </p>
            {% endif %}

            <form class="auth-form" id="register-form" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        minlength="3"
                        maxlength="30"
                        pattern="[A-Za-z0-9_]+"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="auth-submit" type="submit">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="#">Sign in</a>
            </p>

            <p class="auth-footer">
                <a href="/">Return to the moonlit archive</a>
            </p>
        </section>
    </main>
</body>
</html>

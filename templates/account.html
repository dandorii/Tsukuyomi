
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>My Account | Tsukuyomi</title>

    <link rel="icon" type="image/svg+xml"
      href="{{ asset_url('favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
    <link rel="stylesheet" href="{{ asset_url('css/auth.css') }}">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card account-card">
            <h1 class="auth-title">MY ACCOUNT</h1>

            <p class="auth-description">
                Your corner of the night.
                Your words, your memories.
            </p>

            <div class="account-details">
                <p>USERNAME</p>
                <p class="account-username">
                    {{ username }}
                </p>
            </div>

            <nav class="account-actions" aria-label="Account actions">
                <a href="{{ url_for('writing_room') }}">
                    WRITE A LETTER
                </a>

                <a href="{{ url_for('my_letters') }}">
                    MY LETTERS
                </a>

                <a href="{{ url_for('archive') }}">
                    RETURN TO ARCHIVE
                </a>
            </nav>

            <form action="{{ url_for('logout') }}" method="POST" class="auth-form">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ logout_csrf_token }}"
                >

                <button type="submit" class="auth-submit">
                    SIGN OUT
                </button>
            </form>

            <p class="auth-footer">
                Every letter begins with a thought.
            </p>
        </section>
    </main>
</body>
</html>
